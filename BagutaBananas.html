<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pack Shed Intake</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6b2f">
<style>
:root{--g:#2f6b2f;--bg:#f4f1e8;--c:#fff;--t:#1d2a1d;--m:#6b756b;--a:#e8b923;--r:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:18px system-ui,sans-serif;background:var(--bg);color:var(--t);user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--g);color:#fff}
header h1{font-size:20px;margin:0;flex:1}
header input{font:inherit;padding:8px;border-radius:8px;border:0;width:170px}
#st{padding:6px 12px;border-radius:20px;background:#fff3;font-size:15px}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--c);border-radius:14px;padding:12px;box-shadow:0 1px 3px #0002}
h2{margin:0 0 8px;font-size:15px;color:var(--m);text-transform:uppercase;letter-spacing:.05em}
#secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
#secs button{position:relative;height:56px;font:700 20px system-ui;border:2px solid #cfd6cf;background:#fff;border-radius:12px}
#secs button.on{background:var(--g);color:#fff;border-color:var(--g)}
#secs b{position:absolute;top:2px;right:5px;font-size:12px;color:var(--m)}#secs .on b{color:#fff}
#disp{font:700 52px system-ui;text-align:right;padding:6px 12px;background:var(--bg);border-radius:12px;min-height:76px}
#disp small{font-size:18px;color:var(--m);font-weight:400}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
#pad button{height:64px;font:600 28px system-ui;border:0;border-radius:12px;background:#e6eae6}
#pad button:active,#secs button:active{filter:brightness(.9)}
.big{width:100%;height:68px;font:700 24px system-ui;border:0;border-radius:14px;background:var(--a);color:#222}
.big:disabled{opacity:.4}.sub{background:var(--g);color:#fff;margin-top:10px}
#list{max-height:300px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #eee}
.row span:nth-child(2){flex:1}.row i{font-style:normal;font-size:13px;color:var(--m)}
.row button{border:0;background:none;color:var(--r);font-size:26px;width:44px;height:44px}
.sum{display:flex;gap:16px;margin:6px 0 4px;font-weight:700}.sum span small{display:block;color:var(--m);font-weight:400;font-size:13px}
#msg{color:var(--r);min-height:22px;font-size:15px}
</style></head><body>
<header><h1>🍌 Pack Shed Intake</h1><input id="d" type="date"><input id="by" placeholder="Weighed by"><span id="st"></span></header>
<main>
 <section class="card"><h2>1 · Section</h2><div id="secs"></div></section>
 <section class="card"><h2>2 · Bunch weight (kg)</h2>
  <div id="disp"></div><div id="pad"></div>
  <button class="big" id="add">Add bunch</button><div id="msg"></div>
 </section>
 <section class="card" style="grid-column:1/-1"><h2>Day's bunches</h2>
  <div class="sum" id="sum"></div><div id="list"></div>
  <button class="big sub" id="submit"></button>
 </section>
</main>
<script>
const CFG={URL:'https://script.google.com/macros/s/AKfycbydaBm_M_2LNc2aS0b2PcLG06U1Vv_o6e1aOi7hFKCGbeIv5Iliwal-64atswOYjU4/exec',KEY:'BagutaBananas'};
const SEED="A1:3.17,A2:2.79,A3:6.73,A4:6.4,A5:3.64,H:1.7,I:1.5,J:0.33,K:2.29,L:0.9,M:1.51,N:1.73,O:2.09,P:1.32,Q:1.74,R:1.54,S:1.39,T:0.8,U:1.09,V:0.28,Y:1,BB:1.71,CC:1.12,DD:2.43,EE:1.62,FF:2.1,GG:1.73,HH:1.51,II:1.69,JJ:1.8,KK:1.17,LL:1.87,MM:2.4,NN:1.7,OO:1.8,PP:1.65,QQ:1.5";
const $=s=>document.querySelector(s);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let secs=L('secs',null)||SEED.split(',').map(x=>{const a=x.split(':');return{s:a[0],ha:+a[1]}});
let E=L('entries',[]),sel=null,buf='';
const pad2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
$('#d').value=today();$('#by').value=L('by','');
$('#by').oninput=e=>S('by',e.target.value);
$('#d').onchange=()=>render();
const cut=Date.now()-14*864e5;E=E.filter(e=>e.st!=='sent'||e.ts>cut);

function render(){
  const dt=$('#d').value,day=E.filter(e=>e.date===dt);
  $('#secs').innerHTML=secs.map(x=>{const n=day.filter(e=>e.section===x.s).length;
    return '<button data-s="'+x.s+'" class="'+(sel===x.s?'on':'')+'">'+x.s+(n?'<b>'+n+'</b>':'')+'</button>'}).join('');
  $('#disp').innerHTML=(buf||'0')+' <small>kg'+(sel?' · '+sel:' · pick a section')+'</small>';
  const tot=day.reduce((a,e)=>a+e.kg,0),dr=day.filter(e=>e.st==='draft'),q=E.filter(e=>e.st==='queued').length;
  $('#sum').innerHTML='<span>'+day.length+'<small>bunches</small></span><span>'+tot.toFixed(1)+'<small>total kg</small></span><span>'+(day.length?(tot/day.length).toFixed(1):'–')+'<small>avg kg</small></span>';
  $('#list').innerHTML=day.slice().reverse().map(e=>'<div class="row"><span><b>'+e.section+'</b></span><span>'+e.kg+' kg <i>'+(e.st==='sent'?'✔ sent':e.st==='queued'?'⏳ waiting to send':'not submitted')+'</i></span>'+(e.st==='draft'?'<button data-del="'+e.id+'">✕</button>':'')+'</div>').join('')||'<i>No bunches yet for this date.</i>';
  const b=$('#submit');b.disabled=!dr.length;b.textContent=dr.length?'Submit day ('+dr.length+' new bunches)':'Nothing new to submit';
  $('#st').textContent=(navigator.onLine?'● Online':'○ Offline')+(q?' · '+q+' waiting':'');
}
$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>'<button>'+k+'</button>').join('');
$('#pad').onclick=e=>{const k=e.target.textContent;if(e.target.tagName!=='BUTTON')return;
  if(k==='⌫')buf=buf.slice(0,-1);else if(k==='.'){if(buf&&!buf.includes('.'))buf+='.'}else if(buf.length<6)buf+=k;
  $('#msg').textContent='';render()};
$('#secs').onclick=e=>{const s=e.target.closest('button');if(s){sel=s.dataset.s;render()}};
$('#list').onclick=e=>{const id=e.target.dataset.del;if(id){E=E.filter(x=>x.id!==id);S('entries',E);render()}};
$('#add').onclick=()=>{
  const kg=parseFloat(buf);
  if(!sel)return $('#msg').textContent='Pick a section first.';
  if(!(kg>0))return $('#msg').textContent='Enter the bunch weight.';
  if(kg>80&&!confirm(kg+' kg is very heavy. Is that correct?'))return;
  E.push({id:uid(),date:$('#d').value,section:sel,kg:kg,st:'draft',ts:Date.now()});
  S('entries',E);buf='';$('#msg').textContent='';render()};
$('#submit').onclick=()=>{
  const dt=$('#d').value;E.forEach(e=>{if(e.date===dt&&e.st==='draft')e.st='queued'});
  S('entries',E);render();sync()};

let busy=false;
async function sync(){
  const q=E.filter(e=>e.st==='queued');
  if(busy||!q.length||!navigator.onLine||CFG.URL.startsWith('PASTE'))return;
  busy=true;
  try{
    const r=await fetch(CFG.URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({key:CFG.KEY,by:$('#by').value,bunches:q.map(e=>({id:e.id,date:e.date,section:e.section,kg:e.kg}))})});
    const j=await r.json();
    if(j.ok){const ids=new Set(j.ids);E.forEach(e=>{if(ids.has(e.id))e.st='sent'});S('entries',E);$('#msg').textContent=''}
    else $('#msg').textContent='Sync error: '+j.error;
  }catch(err){}
  busy=false;render();
}
async function loadSections(){
  if(!navigator.onLine||CFG.URL.startsWith('PASTE'))return;
  try{const j=await (await fetch(CFG.URL+'?key='+encodeURIComponent(CFG.KEY))).json();
    if(j.ok&&j.sections.length){secs=j.sections;S('secs',secs);render()}}catch(e){}
}
addEventListener('online',()=>{render();sync();loadSections()});addEventListener('offline',render);
setInterval(sync,30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();sync();loadSections();
</script></body></html>
